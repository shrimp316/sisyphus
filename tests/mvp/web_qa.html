<!doctype html><html lang="ko"><meta charset="utf-8"><title>MVP local QA</title><style>body{font:18px system-ui;background:#14212a;color:#eee}button{font:inherit;margin:12px;padding:16px}pre{white-space:pre-wrap}</style><h1>MVP 브라우저 QA · 인공 저장 fixtures</h1><p>이 localhost의 MVP 전용 저장만 교체합니다. 실제 등반 결과가 아닙니다.</p><button data-file="milestone250">250m 첫 해금</button><button data-file="prestige-commit">정상 프레스티지 직전</button><button data-file="after-prestige">프레스티지 후 새 회차</button><button id="inspect">현재 MVP 저장 확인</button><button id="fresh">새 테스트 시작</button><p><a href="index.html">MVP 실행</a></p><pre id="status"></pre><script>const key='sisyphus:mastery-mvp:v1:' + new URL('.',location.href).pathname + ':user://sisyphus-mvp-v1.json';document.querySelectorAll('[data-file]').forEach(b=>b.onclick=async()=>{const payload=await(await fetch('fixtures/'+b.dataset.file+'.json')).json();const existing=JSON.parse(localStorage.getItem(key)||'null');payload.revision=Math.max(payload.revision,existing?.revision||0)+10000;payload.saved_at_unix_msec=Date.now();localStorage.setItem(key,JSON.stringify(payload));document.querySelector('#status').textContent=JSON.stringify({fixture:b.dataset.file,key,revision:payload.revision,phase:payload.prestige_phase,EXP:payload.mastery.available_exp},null,2)});document.querySelector('#inspect').onclick=()=>{const p=JSON.parse(localStorage.getItem(key)||'null');document.querySelector('#status').textContent=JSON.stringify(p?{revision:p.revision,phase:p.prestige_phase,distance:p.run.distance,EXP:p.mastery.available_exp,purchased:p.mastery.purchased_mastery_nodes,prestige_count:p.mastery.prestige_count,threads:p.mastery.threads_balance,malkuth:p.mastery.malkuth_unlocked,settings:p.settings}:null,null,2)};document.querySelector('#fresh').onclick=()=>{localStorage.removeItem(key);document.querySelector('#status').textContent='localStorage만 비움. 새 게임 메뉴에서 명시적 초기화 확인 필요.'};</script></html>
